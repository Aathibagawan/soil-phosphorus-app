name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t soil-phosphorus .
      - name: Smoke test container
        run: |
          docker run -d -p 7860:7860 --name app soil-phosphorus
          for i in $(seq 1 40); do curl -sf localhost:7860/api/health && break; sleep 3; done
          curl -sf localhost:7860/api/health | grep '"model_loaded":true'
