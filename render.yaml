# Render Blueprint: New > Blueprint > pick this repo.
# NOTE: TensorFlow needs ~1 GB RAM at load time; Render's free 512 MB tier is too small.
# Use at least the "starter" plan (or deploy to Hugging Face Spaces, which is free with 16 GB).
services:
  - type: web
    name: soil-phosphorus
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: soil-db, property: connectionString }
      - key: RATE_LIMIT_PER_MIN
        value: "60"
databases:
  - name: soil-db
    plan: free          # free Postgres expires after 30 days; upgrade for permanence
